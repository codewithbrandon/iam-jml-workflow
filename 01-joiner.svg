<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description"><title id="title">Joiner — proposed identity lifecycle workflow</title><desc id="description">Grant role-appropriate access, with a clear approval gate.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L9 5 L0 9 Z" fill="#61748D"/></marker></defs><rect width="1600" height="760" rx="20" fill="#F4F7FB"/><rect x="24" y="24" width="1552" height="712" rx="18" fill="#FFFFFF" stroke="#DDE5EF"/><g font-family="Arial, sans-serif"><text x="64" y="76" fill="#2668C5" font-size="14" font-weight="700" text-anchor="start"><tspan x="64" dy="0">IDENTITY LIFECYCLE  /  01</tspan></text><text x="64" y="124" fill="#14243B" font-size="38" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Joiner</tspan></text><text x="64" y="157" fill="#51627A" font-size="19" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Grant role-appropriate access, with a clear approval gate.</tspan></text><rect x="1270" y="55" width="255" height="35" rx="18" fill="#EEF3FA" stroke="none"/><text x="1397" y="78" fill="#385D8D" font-size="13" font-weight="700" text-anchor="middle"><tspan x="1397" dy="0">PROPOSED WORKFLOW</tspan></text><path d="M64 180 H1536" stroke="#E7ECF2"/><rect x="64" y="245" width="205" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="64" y="245" width="5" height="100" rx="3" fill="#2668C5" stroke="none"/><text x="80" y="269" fill="#2668C5" font-size="13" font-weight="700" text-anchor="start"><tspan x="80" dy="0">HR</tspan></text><text x="80" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="80" dy="0">Confirm</tspan><tspan x="80" dy="24.0">hire</tspan></text><rect x="310" y="245" width="235" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="310" y="245" width="5" height="100" rx="3" fill="#2668C5" stroke="none"/><text x="326" y="269" fill="#2668C5" font-size="13" font-weight="700" text-anchor="start"><tspan x="326" dy="0">MANAGER</tspan></text><text x="326" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="326" dy="0">Request and</tspan><tspan x="326" dy="24.0">approve access</tspan></text><path d="M650 235.0 L720.0 295 L650 355.0 L580.0 295 Z" fill="#EEF4FD" stroke="#2668C5" stroke-width="1.4"/><text x="650" y="287" fill="#243F62" font-size="16" font-weight="700" text-anchor="middle"><tspan x="650" dy="0">Access</tspan><tspan x="650" dy="18.4">approved?</tspan></text><rect x="765" y="245" width="235" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="765" y="245" width="5" height="100" rx="3" fill="#2668C5" stroke="none"/><text x="781" y="269" fill="#2668C5" font-size="13" font-weight="700" text-anchor="start"><tspan x="781" dy="0">IT</tspan></text><text x="781" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="781" dy="0">Provision approved</tspan><tspan x="781" dy="24.0">access</tspan></text><rect x="1040" y="245" width="235" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="1040" y="245" width="5" height="100" rx="3" fill="#2668C5" stroke="none"/><text x="1056" y="269" fill="#2668C5" font-size="13" font-weight="700" text-anchor="start"><tspan x="1056" dy="0">IT</tspan></text><text x="1056" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="1056" dy="0">Verify granted</tspan><tspan x="1056" dy="24.0">access</tspan></text><path d="M269 295 H310" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M545 295 H580" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M720 295 H765" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1000 295 H1040" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="731" y="276" fill="#2464BA" font-size="13" font-weight="700" text-anchor="start"><tspan x="731" dy="0">YES</tspan></text><path d="M650 355 V405" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="662" y="386" fill="#AC4541" font-size="13" font-weight="700" text-anchor="start"><tspan x="662" dy="0">NO</tspan></text><rect x="535" y="405" width="230" height="90" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="535" y="405" width="5" height="90" rx="3" fill="#AD4B45" stroke="none"/><text x="551" y="429" fill="#AD4B45" font-size="13" font-weight="700" text-anchor="start"><tspan x="551" dy="0">OUTCOME</tspan></text><text x="551" y="458" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="551" dy="0">Request denied;</tspan><tspan x="551" dy="24.0">no access granted</tspan></text><text x="850" y="445" fill="#536A82" font-size="16" font-weight="400" text-anchor="start"><tspan x="850" dy="0">Resource-owner approval may also be required.</tspan></text><path d="M64 544 H1536" stroke="#E7ECF2"/><rect x="64" y="565" width="330" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="82" y="589" fill="#AC4541" font-size="12" font-weight="700" text-anchor="start"><tspan x="82" dy="0">RISK</tspan></text><text x="82" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Access exceeds what</tspan><tspan x="82" dy="20.74">the new role requires.</tspan></text><rect x="420" y="565" width="640" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="438" y="589" fill="#2668C5" font-size="12" font-weight="700" text-anchor="start"><tspan x="438" dy="0">PROPOSED CONTROL</tspan></text><text x="438" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="438" dy="0">Approve role-appropriate access; provision</tspan><tspan x="438" dy="20.74">only what was approved and verify.</tspan></text><rect x="1087" y="565" width="449" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="1105" y="589" fill="#536A88" font-size="12" font-weight="700" text-anchor="start"><tspan x="1105" dy="0">EXAMPLE EVIDENCE</tspan></text><text x="1105" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="1105" dy="0">Approved request and</tspan><tspan x="1105" dy="20.74">verification record.</tspan></text><text x="64" y="708" fill="#526780" font-size="14" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Proposed controls • Not evidence of implementation</tspan></text></g></svg>
