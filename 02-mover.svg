<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description"><title id="title">Mover — proposed identity lifecycle workflow</title><desc id="description">Review old access when a person changes roles.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L9 5 L0 9 Z" fill="#61748D"/></marker></defs><rect width="1600" height="760" rx="20" fill="#F4F7FB"/><rect x="24" y="24" width="1552" height="712" rx="18" fill="#FFFFFF" stroke="#DDE5EF"/><g font-family="Arial, sans-serif"><text x="64" y="76" fill="#7251AC" font-size="14" font-weight="700" text-anchor="start"><tspan x="64" dy="0">IDENTITY LIFECYCLE  /  02</tspan></text><text x="64" y="124" fill="#14243B" font-size="38" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Mover</tspan></text><text x="64" y="157" fill="#51627A" font-size="19" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Review old access when a person changes roles.</tspan></text><rect x="1270" y="55" width="255" height="35" rx="18" fill="#EEF3FA" stroke="none"/><text x="1397" y="78" fill="#385D8D" font-size="13" font-weight="700" text-anchor="middle"><tspan x="1397" dy="0">PROPOSED WORKFLOW</tspan></text><path d="M64 180 H1536" stroke="#E7ECF2"/><rect x="64" y="245" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="64" y="245" width="5" height="100" rx="3" fill="#7251AC" stroke="none"/><text x="80" y="269" fill="#7251AC" font-size="13" font-weight="700" text-anchor="start"><tspan x="80" dy="0">HR</tspan></text><text x="80" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="80" dy="0">Confirm role</tspan><tspan x="80" dy="24.0">change</tspan></text><rect x="265" y="245" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="265" y="245" width="5" height="100" rx="3" fill="#7251AC" stroke="none"/><text x="281" y="269" fill="#7251AC" font-size="13" font-weight="700" text-anchor="start"><tspan x="281" dy="0">MANAGER</tspan></text><text x="281" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="281" dy="0">Review and</tspan><tspan x="281" dy="24.0">approve changes</tspan></text><path d="M555 239.0 L617.5 295 L555 351.0 L492.5 295 Z" fill="#F3EEFB" stroke="#7251AC" stroke-width="1.4"/><text x="555" y="287" fill="#243F62" font-size="16" font-weight="700" text-anchor="middle"><tspan x="555" dy="0">Changes</tspan><tspan x="555" dy="18.4">approved?</tspan></text><rect x="645" y="245" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="645" y="245" width="5" height="100" rx="3" fill="#7251AC" stroke="none"/><text x="661" y="269" fill="#7251AC" font-size="13" font-weight="700" text-anchor="start"><tspan x="661" dy="0">IT</tspan></text><text x="661" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="661" dy="0">Remove obsolete</tspan><tspan x="661" dy="24.0">access</tspan></text><rect x="865" y="245" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="865" y="245" width="5" height="100" rx="3" fill="#7251AC" stroke="none"/><text x="881" y="269" fill="#7251AC" font-size="13" font-weight="700" text-anchor="start"><tspan x="881" dy="0">IT</tspan></text><text x="881" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="881" dy="0">Provision new</tspan><tspan x="881" dy="24.0">approved access</tspan></text><rect x="1085" y="245" width="195" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="1085" y="245" width="5" height="100" rx="3" fill="#7251AC" stroke="none"/><text x="1101" y="269" fill="#7251AC" font-size="13" font-weight="700" text-anchor="start"><tspan x="1101" dy="0">IT</tspan></text><text x="1101" y="298" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="1101" dy="0">Verify old and</tspan><tspan x="1101" dy="24.0">new access</tspan></text><path d="M234 295 H265" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M465 295 H492" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M618 295 H645" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M835 295 H865" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1055 295 H1085" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="620" y="275" fill="#7251AC" font-size="13" font-weight="700" text-anchor="start"><tspan x="620" dy="0">YES</tspan></text><path d="M555 351 V405" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="568" y="384" fill="#AC4541" font-size="13" font-weight="700" text-anchor="start"><tspan x="568" dy="0">NO</tspan></text><rect x="460" y="405" width="195" height="95" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="460" y="405" width="5" height="95" rx="3" fill="#AD4B45" stroke="none"/><text x="476" y="429" fill="#AD4B45" font-size="13" font-weight="700" text-anchor="start"><tspan x="476" dy="0">OUTCOME</tspan></text><text x="476" y="458" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="476" dy="0">No new access;</tspan><tspan x="476" dy="24.0">review request</tspan></text><rect x="700" y="405" width="230" height="95" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="700" y="405" width="5" height="95" rx="3" fill="#7251AC" stroke="none"/><text x="716" y="429" fill="#7251AC" font-size="13" font-weight="700" text-anchor="start"><tspan x="716" dy="0">MANAGER</tspan></text><text x="716" y="458" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="716" dy="0">Review obsolete</tspan><tspan x="716" dy="24.0">access</tspan></text><rect x="975" y="405" width="300" height="95" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="975" y="405" width="5" height="95" rx="3" fill="#7251AC" stroke="none"/><text x="991" y="429" fill="#7251AC" font-size="13" font-weight="700" text-anchor="start"><tspan x="991" dy="0">IT</tspan></text><text x="991" y="458" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="991" dy="0">Remove authorized access</tspan><tspan x="991" dy="24.0">and verify removal</tspan></text><path d="M655 452 H700" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M930 452 H975" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M64 544 H1536" stroke="#E7ECF2"/><rect x="64" y="565" width="330" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="82" y="589" fill="#AC4541" font-size="12" font-weight="700" text-anchor="start"><tspan x="82" dy="0">RISK</tspan></text><text x="82" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Old Finance access</tspan><tspan x="82" dy="20.74">remains after a transfer.</tspan></text><rect x="420" y="565" width="640" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="438" y="589" fill="#7251AC" font-size="12" font-weight="700" text-anchor="start"><tspan x="438" dy="0">PROPOSED CONTROL</tspan></text><text x="438" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="438" dy="0">Review and remove obsolete access even</tspan><tspan x="438" dy="20.74">when new access is denied.</tspan></text><rect x="1087" y="565" width="449" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="1105" y="589" fill="#536A88" font-size="12" font-weight="700" text-anchor="start"><tspan x="1105" dy="0">EXAMPLE EVIDENCE</tspan></text><text x="1105" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="1105" dy="0">Role-change ticket and</tspan><tspan x="1105" dy="20.74">verification record.</tspan></text><text x="64" y="708" fill="#526780" font-size="14" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Approvals may also involve resource owners • Proposed controls, not implementation evidence</tspan></text></g></svg>
