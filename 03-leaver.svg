<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description"><title id="title">Leaver — proposed identity lifecycle workflow</title><desc id="description">Act at departure, verify results, and escalate exceptions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L9 5 L0 9 Z" fill="#61748D"/></marker></defs><rect width="1600" height="760" rx="20" fill="#F4F7FB"/><rect x="24" y="24" width="1552" height="712" rx="18" fill="#FFFFFF" stroke="#DDE5EF"/><g font-family="Arial, sans-serif"><text x="64" y="76" fill="#087D72" font-size="14" font-weight="700" text-anchor="start"><tspan x="64" dy="0">IDENTITY LIFECYCLE  /  03</tspan></text><text x="64" y="124" fill="#14243B" font-size="38" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Leaver</tspan></text><text x="64" y="157" fill="#51627A" font-size="19" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Act at departure, verify results, and escalate exceptions.</tspan></text><rect x="1270" y="55" width="255" height="35" rx="18" fill="#EEF3FA" stroke="none"/><text x="1397" y="78" fill="#385D8D" font-size="13" font-weight="700" text-anchor="middle"><tspan x="1397" dy="0">PROPOSED WORKFLOW</tspan></text><path d="M64 180 H1536" stroke="#E7ECF2"/><rect x="64" y="235" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="64" y="235" width="5" height="100" rx="3" fill="#087D72" stroke="none"/><text x="80" y="259" fill="#087D72" font-size="13" font-weight="700" text-anchor="start"><tspan x="80" dy="0">HR</tspan></text><text x="80" y="288" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="80" dy="0">Notify IT of</tspan><tspan x="80" dy="24.0">departure</tspan></text><rect x="254" y="235" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="254" y="235" width="5" height="100" rx="3" fill="#087D72" stroke="none"/><text x="270" y="259" fill="#087D72" font-size="13" font-weight="700" text-anchor="start"><tspan x="270" dy="0">IT</tspan></text><text x="270" y="288" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="270" dy="0">Disable the</tspan><tspan x="270" dy="24.0">account</tspan></text><rect x="444" y="235" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="444" y="235" width="5" height="100" rx="3" fill="#087D72" stroke="none"/><text x="460" y="259" fill="#087D72" font-size="13" font-weight="700" text-anchor="start"><tspan x="460" dy="0">IT</tspan></text><text x="460" y="288" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="460" dy="0">Revoke active</tspan><tspan x="460" dy="24.0">sessions</tspan></text><rect x="634" y="235" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="634" y="235" width="5" height="100" rx="3" fill="#087D72" stroke="none"/><text x="650" y="259" fill="#087D72" font-size="13" font-weight="700" text-anchor="start"><tspan x="650" dy="0">IT</tspan></text><text x="650" y="288" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="650" dy="0">Remove other</tspan><tspan x="650" dy="24.0">access</tspan></text><rect x="824" y="235" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="824" y="235" width="5" height="100" rx="3" fill="#087D72" stroke="none"/><text x="840" y="259" fill="#087D72" font-size="13" font-weight="700" text-anchor="start"><tspan x="840" dy="0">IT</tspan></text><text x="840" y="288" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="840" dy="0">Check account,</tspan><tspan x="840" dy="24.0">access, sessions</tspan></text><path d="M1115 225.0 L1185.0 285 L1115 345.0 L1045.0 285 Z" fill="#E8F6F3" stroke="#087D72" stroke-width="1.4"/><text x="1115" y="277" fill="#243F62" font-size="16" font-weight="700" text-anchor="middle"><tspan x="1115" dy="0">Offboarding</tspan><tspan x="1115" dy="18.4">verified?</tspan></text><path d="M229 285 H254" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M419 285 H444" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M609 285 H634" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M799 285 H824" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1014 285 H1045" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1185 285 H1305 V405" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="1244" y="272" fill="#087D72" font-size="13" font-weight="700" text-anchor="start"><tspan x="1244" dy="0">YES</tspan></text><rect x="1210" y="405" width="220" height="95" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="1210" y="405" width="5" height="95" rx="3" fill="#087D72" stroke="none"/><text x="1226" y="429" fill="#087D72" font-size="13" font-weight="700" text-anchor="start"><tspan x="1226" dy="0">IT</tspan></text><text x="1226" y="458" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="1226" dy="0">Record</tspan><tspan x="1226" dy="24.0">completion</tspan></text><path d="M1115 345 V377 H1045 V405" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="1068" y="367" fill="#AC4541" font-size="13" font-weight="700" text-anchor="start"><tspan x="1068" dy="0">NO</tspan></text><rect x="870" y="405" width="300" height="95" rx="10" fill="#FFFFFF" stroke="#CBD8E6"/><rect x="870" y="405" width="5" height="95" rx="3" fill="#AD4B45" stroke="none"/><text x="886" y="429" fill="#AD4B45" font-size="13" font-weight="700" text-anchor="start"><tspan x="886" dy="0">IT</tspan></text><text x="886" y="458" fill="#182B45" font-size="20" font-weight="700" text-anchor="start"><tspan x="886" dy="0">Escalate to Security;</tspan><tspan x="886" dy="24.0">track unresolved access</tspan></text><path d="M870 452 H795 V377 H919 V335" fill="none" stroke="#61748D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="644" y="399" fill="#526780" font-size="14" font-weight="700" text-anchor="start"><tspan x="644" dy="0">After remediation</tspan></text><path d="M64 544 H1536" stroke="#E7ECF2"/><rect x="64" y="565" width="330" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="82" y="589" fill="#AC4541" font-size="12" font-weight="700" text-anchor="start"><tspan x="82" dy="0">RISK</tspan></text><text x="82" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Access remains available</tspan><tspan x="82" dy="20.74">after departure.</tspan></text><rect x="420" y="565" width="640" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="438" y="589" fill="#087D72" font-size="12" font-weight="700" text-anchor="start"><tspan x="438" dy="0">PROPOSED CONTROL</tspan></text><text x="438" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="438" dy="0">Disable at departure; remove access, check</tspan><tspan x="438" dy="20.74">results, and escalate unresolved exceptions.</tspan></text><rect x="1087" y="565" width="449" height="105" rx="10" fill="#F7F9FC" stroke="#E2E9F2"/><text x="1105" y="589" fill="#536A88" font-size="12" font-weight="700" text-anchor="start"><tspan x="1105" dy="0">EXAMPLE EVIDENCE</tspan></text><text x="1105" y="617" fill="#263C58" font-size="17" font-weight="400" text-anchor="start"><tspan x="1105" dy="0">Offboarding ticket and</tspan><tspan x="1105" dy="20.74">verification record.</tspan></text><text x="64" y="708" fill="#526780" font-size="14" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Late notice: act promptly and escalate • Session revocation varies by application • Proposed design</tspan></text></g></svg>
